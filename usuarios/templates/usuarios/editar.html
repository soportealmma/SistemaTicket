{% extends "base/base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="container mt-4">

    <h3 class="fw-bold mb-3">Editar Usuario</h3>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <h5>Datos del Usuario</h5>
        {{ form_user | crispy }}

        <h5 class="mt-3">Perfil</h5>
        {{ form_perfil | crispy}}

        <button class="btn btn-success mt-3">Guardar cambios</button>
        <a href="{% url 'listar_usuarios' %}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>

</div>
{% endblock %}
