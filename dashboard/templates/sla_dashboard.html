{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-6 py-6">
  <h2 class="text-3xl font-bold mb-6 text-center">📊 Dashboard SLA Interactivo</h2>

  <!-- Tabs -->
  <div class="flex justify-center mb-6 space-x-4">
    <button onclick="openTab('criticidad')" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Criticidad</button>
    <button onclick="openTab('canal')" class="px-4 py-2 bg-green-600 text-white rounded-lg">Canal</button>
    <button onclick="openTab('cumplimiento')" class="px-4 py-2 bg-yellow-600 text-white rounded-lg">Cumplimiento</button>
    <button onclick="openTab('fabricante')" class="px-4 py-2 bg-purple-600 text-white rounded-lg">Fabricante</button>
  </div>

  <!-- Contenido de Tabs -->
  <div id="criticidad" class="tab-content">{{ criticidad_chart|safe }}</div>
  <div id="canal" class="tab-content hidden">{{ canal_chart|safe }}</div>
  <div id="cumplimiento" class="tab-content hidden">{{ cumplimiento_chart|safe }}</div>
  <div id="fabricante" class="tab-content hidden">{{ fabricante_chart|safe }}</div>
</div>

<script>
  function openTab(tabId) {
    document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
    document.getElementById(tabId).classList.remove("hidden");
  }
</script>
{% endblock %}
