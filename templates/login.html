{% extends "base.html" %}


{% block title %}Login{% endblock %}

{% block content %}
{% load crispy_forms_tags %}
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; border: 1px solid #ccc; }
        button { width: 100%; padding: 0.7rem; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .errorlist { color: red; list-style: none; padding: 0; }
    </style>


<div class="container-fluid justify-content-center">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h1 class="text-center"><h2>Iniciar Sesión</h2></h1>
            <br>
            <form method="post" class="container justify-content-center">
                {% csrf_token %}
                {{ form | crispy }}
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>

    </div>

</div>


 {% endblock %}
