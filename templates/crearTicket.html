{% extends 'base.html' %}

{% block title %}Mis Tickets - Sistema de Soporte Técnico{% endblock %}

{% block content %}
{% csrf_token %}
{% load crispy_forms_tags %}
 
    <div class="container d-fluid justify-content-center border border-gray-200 rounded-md">
        <div class="text-center">
            <h1>Crear Tickets</h1>
        </div>
        <br>
            <div class="row justify-content-center">
                    <div class="row col-md-6">
                        <form method="post" class="my-class">
                    
                        {% csrf_token %}
                        {{ form |crispy }}
                        <button type="submit" class="btn btn-primary">Crear Ticket</button>
                    
                        </form>

                    </div>


            </div>

    </div>
{% endblock %}
