{% extends 'base/base.html' %}

{% block title %}Editar Tickets - Sistema de Soporte Técnico{% endblock %}

{% block content %}
{% csrf_token %}
{% load crispy_forms_tags %}
 
    <div class="container d-fluid justify-content-center border border-gray-200 rounded-md">
        <div class="text-center">
            <h1>Editar Tickets</h1>
        </div>
        <br>
            <div class="row justify-content-center">
                    <div class="row col-md-6">
                        <form method="post" class="my-class">
                    
                        {% csrf_token %}
                        {{ form |crispy }}
                        <button type="submit" class="btn btn-primary">Actualizar</button>
                        <button type="btn" style="margin-left: 20px;" href="{% url 'listar_ticket' %}" class="btn btn-danger">Cancelar</button><br>
                    
                        </form>

                    </div>


            </div>

    </div>
{% endblock %}
