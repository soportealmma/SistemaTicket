{% extends "base/base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="container mt-4">

    <h3 class="fw-bold mb-3">Nueva Asignación</h3>

    <form method="POST">
        {% csrf_token %}
        {{ form | crispy }}

        <button class="btn btn-success">Guardar</button>
        <a href="{% url 'listar_asignaciones' %}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>
{% endblock %}
