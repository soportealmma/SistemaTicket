{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Crear RMA{% endblock %}

{% block content %}

<div class="container border border-light rounded-md mt-4">
    <div class="row">
        <div class="col-2"></div>

        <div class="col-8">
            <div class="text-center mb-4">
                <h1 class="fw-bold">Crear Solicitud de RMA</h1>
                <p class="text-muted">Complete la información del cliente y del equipo</p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row">
                    {{ form|crispy }}
                </div>

                <!-- ========================= -->
                <!--   IMÁGENES DEL RMA        -->
                <!-- ========================= -->
                <div class="card shadow-sm mb-3">
                    <div class="card-header bg-dark text-white">
                        <strong>Imágenes del RMA</strong>
                    </div>

                    <div class="card-body">

                        <!-- Contenedor donde se agregarán los bloques -->
                        <div id="contenedor-imagenes"></div>

                        <!-- Botón para agregar un nuevo bloque -->
                        <button type="button" class="btn btn-primary mt-3" onclick="agregarBloqueImagen()">
                            + Agregar imagen
                        </button>

                    </div>
                </div>

                <!-- BOTÓN -->
                <div class="text-center mt-4 mb-4">
                    <button type="submit" class="btn btn-success px-5">Crear RMA</button>
                </div>

            </form>
        </div>

        <div class="col-2"></div>
    </div>
</div>

<script>
let contador = 0;

function agregarBloqueImagen() {
    contador++;

    const bloque = `
        <div class="card mb-3 p-3 border" id="bloque-${contador}">
            <div class="row g-2">

                <!-- Imagen -->
                <div class="col-md-4">
                    <label class="form-label">Imagen</label>
                    <input type="file" name="imagen_${contador}" class="form-control" accept="image/*" required>
                </div>

                <!-- Descripción -->
                <div class="col-md-7">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion_${contador}" class="form-control" rows="3" placeholder="Descripción de la imagen"></textarea>
                </div>

                <!-- Botón eliminar -->
                <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-danger" onclick="eliminarBloque(${contador})">
                        X
                    </button>
                </div>

            </div>
        </div>
    `;

    document.getElementById("contenedor-imagenes").insertAdjacentHTML("beforeend", bloque);
}

function eliminarBloque(id) {
    document.getElementById(`bloque-${id}`).remove();
}
</script>

{% endblock %}
