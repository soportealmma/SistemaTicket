{% extends "base/base.html" %}
{% load static %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">Editar Tarea #{{ tarea.id }}</h3>

        <a href="{% url 'detalle_tarea' tarea.id %}" class="btn btn-secondary">
            Volver
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Título</label>
                        {{ form.titulo }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Fecha Compromiso</label>
                        {{ form.fecha_compromiso }}
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Descripción</label>
                        {{ form.descripcion }}
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Criticidad</label>
                        {{ form.criticidad }}
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Estado</label>
                        {{ form.estado }}
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Responsable</label>
                        {{ form.responsable }}
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Observaciones</label>
                        {{ form.observaciones }}
                    </div>

                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        Guardar Cambios
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
